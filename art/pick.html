<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keys - cover art picks</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 28px 20px 80px; background: #0b0d11; color: #e7e9ee;
         font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: #9aa1ad; margin: 0 0 24px; font-size: 14px; }
  .grp { display: grid; grid-template-columns: 160px 1fr; gap: 18px; align-items: start;
         padding: 16px 0; border-top: 1px solid #1c212b; }
  .grp:first-of-type { border-top: 0; }
  .pick img { width: 160px; height: 160px; border-radius: 10px; display: block;
              box-shadow: 0 8px 22px rgba(0,0,0,.55); }
  .pick .none { width: 160px; height: 160px; border-radius: 10px; border: 1px dashed #333c4a;
                display: grid; place-items: center; color: #6d7683; font-size: 12px; text-align: center; padding: 10px; box-sizing: border-box; }
  .key { font: 600 15px ui-monospace, Consolas, monospace; color: #f0f2f6; }
  .meta { color: #9aa1ad; font-size: 13.5px; margin: 2px 0 12px; }
  .meta a { color: #7fb0ff; }
  .cands { display: flex; gap: 10px; flex-wrap: wrap; }
  .cand { width: 104px; }
  .cand img { width: 104px; height: 104px; border-radius: 7px; display: block; border: 2px solid transparent; }
  .cand.on img { border-color: #e0a44b; }
  .cand .n { font: 600 12px ui-monospace, monospace; color: #e0a44b; margin-top: 5px; }
  .cand .t { font-size: 11.5px; color: #838b97; line-height: 1.35; margin-top: 2px;
             display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<h1>Cover art picks</h1>
<p class="sub">Big plate on the left is what the app will use. Numbered thumbs are the other real releases that matched. Say <b>"group N"</b> for any you want swapped.</p>
<div id="out"></div>
<script type="module">
const out = document.getElementById('out');
const r = await fetch('art.json?' + Date.now());
const { manifest, fetched } = await r.json();
document.querySelector('.sub').insertAdjacentHTML('beforeend',
  ' <span style="color:#6d7683">Fetched ' + new Date(fetched).toLocaleString() + '.</span>');
for (const [group, m] of Object.entries(manifest)) {
  const el = document.createElement('div');
  el.className = 'grp';
  const plate = m.file
    ? `<img src="512/${group}.jpg" alt="">`
    : `<div class="none">no honest recording<br>designed plate instead</div>`;
  const cands = (m.candidates ?? []).map((c, i) => `
    <div class="cand ${i === 0 ? 'on' : ''}">
      <img src="${c.file ?? ''}" alt="">
      <div class="n">${group} ${i}</div>
      <div class="t">${c.album}${c.year ? ' &middot; ' + c.year : ''}</div>
    </div>`).join('');
  el.innerHTML = `<div class="pick">${plate}</div>
    <div>
      <div class="key">${group}</div>
      <div class="meta">${m.file
        ? `${m.artist} &middot; <b>${m.album}</b> ${m.year ? '(' + m.year + ')' : ''} &middot; <a href="${m.source}" target="_blank" rel="noopener">source</a>`
        : m.reason}</div>
      <div class="cands">${cands}</div>
    </div>`;
  out.appendChild(el);
}
</script>
</body>
</html>
