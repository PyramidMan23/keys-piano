<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keys Duet</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Duet: the score and the falls on one screen, one clock. Local prototype,
     not wired into the shell or the service worker. */
  :root { --duet-bg: #050806; --duet-line: #253129; --duet-ink: #e9ede7; --duet-mute: #788c82; --duet-mint: #82bf9c; }
  html, body { margin: 0; background: var(--duet-bg); color: var(--duet-ink); height: 100%; }
  body { display: flex; flex-direction: column; font: 14px/1.4 Helvetica, Arial, sans-serif; }
  .duet-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--duet-line); }
  .duet-bar h1 { font: 600 18px/1 Fraunces, Georgia, serif; margin: 0 8px 0 0; }
  .duet-bar select, .duet-bar button, .duet-bar input[type=range] { min-height: 40px; background: #000; color: var(--duet-ink); border: 1px solid var(--duet-line); border-radius: 3px; font: 700 12px/1 Helvetica, Arial, sans-serif; padding: 0 12px; }
  .duet-bar select { max-width: 280px; }
  .duet-bar button[aria-pressed="true"], .duet-bar button.accent { border-color: var(--duet-mint); color: var(--duet-mint); }
  .duet-bar label { display: flex; align-items: center; gap: 6px; color: var(--duet-mute); font-size: 12px; }
  .ladder { display: flex; }
  .ladder button { border-radius: 0; margin-left: -1px; }
  .ladder button:first-child { border-radius: 3px 0 0 3px; }
  .ladder button:last-child { border-radius: 0 3px 3px 0; }
  .duet-stage { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 10px 16px 16px; gap: 0; }
  .duet-score { position: relative; background: #f5f1e6; border-radius: 4px 4px 0 0; overflow-x: auto; overflow-y: hidden; height: 300px; flex: none; transition: opacity .3s; }
  .duet-score .engraved-score [data-hand="R"][data-state="current"] path { fill: #c98a12; stroke: #c98a12; }
  .duet-score .engraved-score [data-hand="L"][data-state="current"] path { fill: #138aa0; stroke: #138aa0; }
  .duet-playhead { position: absolute; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: rgba(46,107,71,.35); pointer-events: none; transition: left .12s ease-out; }
  .duet-notice { color: #23282f; padding: 18px; }
  .duet-seam { height: 6px; background: linear-gradient(90deg, #c98a12, #2e6b47 50%, #138aa0); flex: none; }
  .duet-falls-wrap { position: relative; flex: 1; min-height: 220px; }
  .duet-falls-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .duet-status { display: flex; gap: 16px; padding: 8px 16px; color: var(--duet-mute); font: 12px/1.3 ui-monospace, Menlo, monospace; border-top: 1px solid var(--duet-line); }
  .duet-status b { color: var(--duet-ink); font-weight: 700; }
  .duet-tip { color: var(--duet-mint); }
  @media (max-width: 640px) { .duet-score { height: 230px; } .duet-bar select { max-width: 100%; flex: 1 1 100%; } }
</style>
</head>
<body>
<header class="duet-bar">
  <h1>Keys · Duet</h1>
  <select id="song" aria-label="Song"></select>
  <div class="ladder" role="group" aria-label="Reading help">
    <button data-level="1" title="The bars teach, the score sits beside them so your eye gets used to it">1 · Bars lead</button>
    <button data-level="2" title="Both at full strength, no letters on the bars">2 · Side by side</button>
    <button data-level="3" title="The score leads; bars arrive late, as a check">3 · Score leads</button>
    <button data-level="4" title="Only the score. The keyboard still lights to confirm.">4 · Read it</button>
  </div>
  <label><input id="wait" type="checkbox" checked> Wait for me</label>
  <label>Tempo <input id="tempo" type="range" min="40" max="120" value="80"> <span id="tempo-val">80%</span></label>
  <button id="hear">▶ Hear it</button>
  <button id="restart">↺ Restart</button>
  <button id="midi">🎹 Connect piano</button>
</header>
<main class="duet-stage">
  <div id="score" class="duet-score"></div>
  <div class="duet-seam" aria-hidden="true"></div>
  <div class="duet-falls-wrap"><canvas id="falls"></canvas></div>
</main>
<footer class="duet-status" id="status" role="status"></footer>
<script type="module" src="js/duet.mjs"></script>
</body>
</html>
