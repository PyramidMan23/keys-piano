<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Keys Duet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  /* Duet. Same tokens as the canon: black ground, #253129 rules, mint actions,
     Fraunces titles, cream page. Flat surfaces, no background glow. */
  :root { --d-line: #253129; --d-ink: #e9ede7; --d-mute: #788c82; --d-mint: #82bf9c; --d-act: #2e6b47; --d-page: #f5f1e6; }
  html, body { margin: 0; background: #000; color: var(--d-ink); height: 100%; }
  body { display: flex; flex-direction: column; font: 14px/1.4 Helvetica, Arial, sans-serif; overflow: hidden; }
  .d-top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--d-line); }
  .d-back { color: var(--d-mute); text-decoration: none; font: 700 12px/1 Helvetica, Arial, sans-serif; min-height: 44px; display: flex; align-items: center; }
  .d-back:hover { color: var(--d-ink); }
  .d-title { font: 600 18px/1 Fraunces, Georgia, serif; margin: 0; }
  .d-top select { flex: 1 1 auto; min-width: 0; max-width: 320px; }
  .d-spacer { flex: 1; }
  .d-btn, .d-top select { min-height: 44px; background: #000; color: var(--d-ink); border: 1px solid var(--d-line); border-radius: 3px; font: 700 12px/1 Helvetica, Arial, sans-serif; padding: 0 13px; cursor: pointer; transition: border-color .12s; }
  .d-btn:hover:not(:disabled) { border-color: #3d4f45; }
  .d-btn:focus-visible, .d-top select:focus-visible { outline: 2px solid var(--d-mint); outline-offset: 2px; }
  .d-btn:disabled { color: #3d4f45; cursor: default; }
  .d-btn.primary { background: var(--d-act); border-color: var(--d-act); }
  .d-stage { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 12px 16px 0; }
  .d-page { position: relative; background: var(--d-page); border-radius: 3px 3px 0 0; height: 290px; flex: none; overflow: hidden; }
  #score-strip { position: absolute; inset: 0; overflow: hidden; }
  #score-strip > .engraved-score { will-change: transform; }
  #score-strip .engraved-score [data-hand="R"][data-state="current"] path { fill: #b8860b; stroke: #b8860b; }
  #score-strip .engraved-score [data-hand="L"][data-state="current"] path { fill: #0e7f93; stroke: #0e7f93; }
  #score-strip .engraved-score [data-state="current"] { filter: none; }
  .d-line { position: absolute; top: 10px; bottom: 10px; left: 28%; width: 2px; margin-left: -1px; background: var(--d-act); opacity: .55; pointer-events: none; }
  .d-falls { position: relative; flex: 1; min-height: 200px; border-top: 1px solid var(--d-line); }
  .d-falls canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #link { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .d-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px; border-top: 1px solid var(--d-line); }
  .d-help { display: flex; align-items: center; gap: 8px; }
  .d-help .cap, .d-foot label { font: 400 11px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .1em; color: var(--d-mute); text-transform: uppercase; }
  #help-pips { display: flex; gap: 3px; }
  #help-pips i { display: block; width: 16px; height: 5px; border: 1px solid var(--d-line); }
  #help-pips i[data-on="true"] { background: var(--d-mint); border-color: var(--d-mint); }
  #help-label { font: 700 12px/1 Helvetica, Arial, sans-serif; color: var(--d-ink); min-width: 104px; }
  .d-foot label { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .d-foot input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--d-mint); }
  .d-foot input[type=range] { width: 110px; accent-color: var(--d-mint); }
  #tempo-val { color: var(--d-ink); font-weight: 700; min-width: 36px; }
  #status { margin-left: auto; color: var(--d-mute); font: 12px/1.3 ui-monospace, Menlo, monospace; }
  @media (max-width: 640px) {
    .d-title, .d-spacer { display: none; }
    .d-top { flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
    .d-top select { max-width: none; flex-basis: calc(100% - 70px); }
    .d-stage { padding: 8px 12px 0; }
    .d-page { height: 230px; }
    .d-foot { padding: 6px 12px; }
    #status { flex-basis: 100%; margin: 0; }
  }
  @media (prefers-reduced-motion: reduce) { #link { display: none; } }
</style>
</head>
<body>
<header class="d-top">
  <a class="d-back" href="./">← Keys</a>
  <h1 class="d-title">Duet</h1>
  <select id="song" aria-label="Song"></select>
  <span class="d-spacer"></span>
  <button id="hear" class="d-btn">Hear it</button>
  <button id="restart" class="d-btn">Restart</button>
  <button id="midi" class="d-btn">Connect piano</button>
</header>
<main class="d-stage">
  <div class="d-page"><div id="score-strip"></div><div class="d-line" aria-hidden="true"></div></div>
  <div class="d-falls"><canvas id="falls"></canvas></div>
  <canvas id="link" aria-hidden="true"></canvas>
</main>
<footer class="d-foot">
  <div class="d-help" role="group" aria-label="Help">
    <span class="cap">Help</span>
    <button id="less" class="d-btn" aria-label="Less help">−</button>
    <span id="help-pips" aria-hidden="true"></span>
    <button id="more" class="d-btn" aria-label="More help">+</button>
    <span id="help-label" role="status"></span>
  </div>
  <label><input id="wait" type="checkbox" checked> Wait for me</label>
  <label>Tempo <input id="tempo" type="range" min="40" max="120" value="80"> <span id="tempo-val">80%</span></label>
  <span id="status" role="status"></span>
</footer>
<script type="module" src="js/duet.mjs"></script>
</body>
</html>
