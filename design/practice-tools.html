<!-- App-drawn extension to the existing session guide. Inherits Keys type and color. -->
<div class="practice-insight" aria-live="polite"><strong id="practice-baseline-label"></strong><p id="practice-baseline"></p><p id="practice-conditions"></p></div>
<details class="practice-details" id="passage-details"><summary>Choose a passage</summary><p>Times use the song’s original tempo. Your selection stays put when you slow down.</p><div class="passage-fields"><label>From (seconds)<input id="passage-from" type="number" min="0" step="0.1" inputmode="decimal"></label><label>To (seconds)<input id="passage-to" type="number" min="0" step="0.1" inputmode="decimal"></label><button id="passage-apply" class="tool" type="button">Loop passage</button><button id="passage-clear" class="ghost" type="button">Whole song</button></div><p id="passage-message" role="status"></p></details>
<details class="practice-details" id="evidence-details"><summary>Your recent attempts</summary><p>Compare the same passage, hands, tempo and help. A later unaided check is stronger evidence than a helped retry.</p><ol id="practice-history" class="practice-history"></ol></details>
